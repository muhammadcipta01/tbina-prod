<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cek Barang - Pemindaian</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <i class="fas fa-barcode"></i>
        <h1>Sistem Quality Control</h1>
    </header>

    <div class="container-split">
        
        <section class="card scan-area">
            <h2><i class="fas fa-camera"></i> Pemindaian Otomatis</h2>
            <p class="status-message" id="search-status">Siap memindai...</p>
            <div id="reader"></div>
        </section>

        <section class="card manual-search-area">
            <h2><i class="fas fa-keyboard"></i> Pencarian Manual</h2>

            <div class="input-group">
                <input type="text" id="input-qrcode-id" placeholder="Masukkan ID QR Code..." aria-label="Input QR Code ID">
                <button class="btn btn-primary" onclick="searchManual('qrcode')">
                    <i class="fas fa-search"></i> Cari ID
                </button>
            </div>
            
            <div class="input-group">
                <input type="text" id="input-model" placeholder="Masukkan Model Barang..." aria-label="Input Model Barang">
                <button class="btn btn-secondary" onclick="searchManual('model')">
                    <i class="fas fa-tag"></i> Cari Model
                </button>
            </div>
            
            <p style="color: gray; font-size: 0.9em; margin-top: 20px;">*Gunakan pencarian manual jika kamera tidak tersedia.</p>
        </section>
    </div>

    <script src="index.js"></script>
</body>
</html>
